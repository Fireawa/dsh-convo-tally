name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          for file in lib/*.js test/*.mjs scripts/*.mjs; do
            node --check "$file"
          done

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 离线自检
        run: npm test
