name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          # 目录可能为空（例如某个子目录的文件被删光），nullglob 让不匹配的模式展开成空数组
          shopt -s nullglob
          files=(index.js lib/*.js test/*.mjs scripts/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到待检查的源文件" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "check $file"
            node --check "$file"
          done

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 离线自检
        run: npm test
