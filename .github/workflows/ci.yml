name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          # nullglob: 不匹配的模式展开成空数组；再逐项 -f 检查，文件和目录被删都不会炸
          shopt -s nullglob
          files=(lib/*.js test/*.mjs scripts/*.mjs)
          checked=0
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            echo "check $file"
            node --check "$file"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "没有找到待检查的源文件" >&2
            exit 1
          fi
          echo "checked $checked files"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 离线自检
        run: npm test
